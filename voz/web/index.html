<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>José</title>
<style>
  /* Mesma tela do jose.py original: imagens 1920x1080, coordenadas em pixels da imagem */
  :root {
    --fundo: #FFFFFF;
    --principal: #1800AD;
    --titulo-historia: #FF751F;
    --dica: #FF0000;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--fundo);
    font-family: Arial, Helvetica, sans-serif;
    cursor: none;
  }
  /* O palco (1920x1080) é enquadrado por JS: dá zoom até o desenho do estado atual preencher a tela */
  #palco {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    overflow: hidden;
    background: var(--fundo);
  }
  #palco.pronto { transition: transform 0.35s ease; }
  #rosto {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
  }
  /* Ao ouvir "José" o olho esquerdo vai de x 571.4 para x 108 em 0.3 s */
  #rosto.deslizando {
    transform: translateX(-463.4px);
    transition: transform 0.3s linear;
  }
  .texto {
    position: absolute;
    left: 0;
    width: 1920px;
    text-align: center;
    color: var(--principal);
    font-weight: bold;
  }
  #comando {
    top: 240px;
    left: 100px;
    width: 1720px;
    font-size: 80px;
    transform: translateY(-50%);
  }
  #agradecimento {
    top: 540px;
    font-size: 93px;
    transform: translateY(-50%);
  }
  #historia { position: absolute; inset: 0; }
  /* Barra: bolinha de 65 px andando de (164.6, 908.8) até (1617, 908.8), linha de 15 px */
  #linha {
    position: absolute;
    left: 197.1px;
    width: 1452.4px;
    top: 933.8px;
    height: 15px;
    border-radius: 8px;
    background: var(--principal);
  }
  #bolinha {
    position: absolute;
    left: 164.6px;
    top: 908.8px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: var(--principal);
  }
  #titulo {
    position: absolute;
    left: 0;
    width: 1846.6px; /* centralizado na barra (x 923.3), não na tela */
    bottom: 191.2px; /* base do texto 20 px acima da bolinha */
    text-align: center;
    color: var(--titulo-historia);
    font-weight: bold;
    font-size: 53px;
  }
  /* Modo conversa: mesma fonte e tamanho do título da história */
  #fase, #dica {
    position: absolute;
    font-weight: bold;
    font-size: 53px;
  }
  #fase { right: 60px; bottom: 50px; color: var(--principal); }
  #dica { left: 60px; top: 40px; color: var(--dica); }
  #transcricao, #velocidade {
    position: fixed;
    color: gray;
    font-family: Consolas, "DejaVu Sans Mono", monospace;
  }
  #transcricao {
    left: 10px;
    bottom: 10px;
    max-width: calc(50vw - 20px);
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #velocidade { right: 10px; bottom: 10px; font-size: 13px; }
  #aviso-chamar {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--principal);
    color: #fff;
    font-size: 24px;
    font-weight: bold;
  }
  #aviso {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--fundo);
    color: var(--principal);
    font-size: 32px;
    text-align: center;
    padding: 16px;
  }
  /* A cara do José não mostra mensagens de texto (o que ele ouviu, velocidade, dicas, fases da conversa).
     Para ver, abra com ?debug=1 (ex.: http://localhost:8090/?debug=1) */
  body:not(.debug) #transcricao,
  body:not(.debug) #velocidade,
  body:not(.debug) #fase,
  body:not(.debug) #dica,
  body:not(.debug) #aviso-chamar { display: none !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="palco">
  <img id="rosto" src="/rostojose/joseacordado.png" alt="">
  <div id="comando" class="texto" hidden></div>
  <div id="agradecimento" class="texto" hidden>Ao seu dispor</div>
  <div id="historia" hidden>
    <div id="titulo"></div>
    <div id="linha"></div>
    <div id="bolinha"></div>
  </div>
  <div id="fase" hidden></div>
  <div id="dica" hidden>diga "voltar" para retornar ao menu</div>
</div>
<div id="transcricao"></div>
<div id="velocidade"></div>
<div id="aviso-chamar" hidden></div>
<div id="aviso">José não está respondendo.<br>Rode: python voz/jose.py</div>

<script>
  const IMAGENS = {
    acordado: 'joseacordado.png',
    transicao: 'joseacordado.png',
    ouvindo: 'joseouvindo.jpg',
    comando: 'Josefechado.png',
    executando: 'Josefechado.png',
    historia: 'josehistoria.png',
    carregando: 'Josefechado.png',
    conversa: 'joseacordado.png',
    pensando: 'Josefechado.png',
    respondendo: 'joseresponde.png',
  };
  const FASES = {
    carregando: 'carregando...',
    conversa: 'ouvindo...',
    pensando: 'pensando...',
    respondendo: 'respondendo...',
  };
  const COM_DICA = ['conversa', 'pensando', 'respondendo'];
  // Pré-carrega para a troca de rosto não piscar
  Object.values(IMAGENS).forEach((nome) => { new Image().src = `/rostojose/${nome}`; });

  const $ = (id) => document.getElementById(id);
  const palco = $('palco');

  // ---- Enquadramento: a cara usa só uma parte pequena da imagem 1920x1080 (o resto é branco). Mede onde está o
  // desenho de cada estado (e o texto, quando há) e dá zoom até esse conteúdo preencher a tela.
  // Nas imagens "ouvindo" e "história" a lista de palavras ("Me segue", "Parar"...) está desenhada dentro da própria
  // imagem, à direita do rosto. A cara não mostra mensagens: corta esse texto fora (?debug=1 mostra tudo).
  const DEBUG = new URLSearchParams(location.search).has('debug');
  const CORTE_TEXTO = DEBUG ? {} : { ouvindo: 960, historia: 1030 }; // x (px da imagem) a partir do qual é texto
  const MARGEM = 0.06; // folga em volta do conteúdo
  const ZOOM_MAX = 6;
  const DESLIZE = 463.4; // quanto o rosto desliza ao ouvir "José"
  const caixas = {};

  // Retângulo (em px da imagem) do que não é branco, ou null
  const caixaDaImagem = (nome, xMax = 1920) => caixas[`${nome}|${xMax}`] ??= new Promise((pronto) => {
    const img = new Image();
    img.onload = () => {
      const L = 480, A = 270; // amostra reduzida (1/4): rápido e já suaviza a borda
      const c = document.createElement('canvas');
      c.width = L; c.height = A;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, L, A);
      ctx.drawImage(img, 0, 0, L, A);
      const d = ctx.getImageData(0, 0, L, A).data;
      let x0 = L, y0 = A, x1 = -1, y1 = -1;
      for (let y = 0; y < A; y++) {
        for (let x = 0; x < Math.min(L, xMax / 4); x++) {
          const i = (y * L + x) * 4;
          if (d[i] < 235 || d[i + 1] < 235 || d[i + 2] < 235) {
            if (x < x0) x0 = x;
            if (x > x1) x1 = x;
            if (y < y0) y0 = y;
            if (y > y1) y1 = y;
          }
        }
      }
      pronto(x1 < 0 ? null : { x0: x0 * 4, y0: y0 * 4, x1: (x1 + 1) * 4, y1: (y1 + 1) * 4 });
    };
    img.onerror = () => pronto(null);
    img.src = `/rostojose/${nome}`;
  });

  // Retângulo do texto de um elemento, em px do palco (independe do zoom e da animação em curso)
  const caixaDoTexto = (el) => {
    const faixa = document.createRange();
    faixa.selectNodeContents(el);
    const r = faixa.getBoundingClientRect();
    const p = palco.getBoundingClientRect();
    const k = p.width / 1920;
    return { x0: (r.left - p.left) / k, y0: (r.top - p.top) / k, x1: (r.right - p.left) / k, y1: (r.bottom - p.top) / k };
  };

  let enquadramento = 0;
  let estadoAtual = 'acordado';
  const enquadrar = async (estado) => {
    const minha = ++enquadramento; // se o estado mudar no meio, vale só o último
    const nome = IMAGENS[estado];
    const rosto = nome ? await caixaDaImagem(nome, CORTE_TEXTO[estado] || 1920) : null;
    if (minha !== enquadramento) return;
    const partes = rosto ? [rosto] : [];
    if (rosto && estado === 'transicao') partes.push({ ...rosto, x0: rosto.x0 - DESLIZE, x1: rosto.x1 - DESLIZE });
    for (const id of ['comando', 'agradecimento']) if (!$(id).hidden) partes.push(caixaDoTexto($(id)));
    if (estado === 'historia') partes.push(caixaDoTexto($('titulo')), { x0: 164.6, y0: 908.8, x1: 1682, y1: 973.8 });
    if (!partes.length) partes.push({ x0: 0, y0: 0, x1: 1920, y1: 1080 });
    const u = {
      x0: Math.min(...partes.map((r) => r.x0)), y0: Math.min(...partes.map((r) => r.y0)),
      x1: Math.max(...partes.map((r) => r.x1)), y1: Math.max(...partes.map((r) => r.y1)),
    };
    const escala = Math.min(
      innerWidth / ((u.x1 - u.x0) * (1 + 2 * MARGEM)),
      innerHeight / ((u.y1 - u.y0) * (1 + 2 * MARGEM)),
      ZOOM_MAX,
    );
    const tx = innerWidth / 2 - ((u.x0 + u.x1) / 2) * escala;
    const ty = innerHeight / 2 - ((u.y0 + u.y1) / 2) * escala;
    palco.style.transform = `translate(${tx}px, ${ty}px) scale(${escala})`;
    if (!palco.classList.contains('pronto')) requestAnimationFrame(() => palco.classList.add('pronto'));
  };
  addEventListener('resize', () => enquadrar(estadoAtual));
  enquadrar(estadoAtual);

  // Clique entra em tela cheia (Esc sai)
  document.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  });

  if (DEBUG) document.body.classList.add('debug');

  let estadoAnterior = null;
  let chaveAnterior = '';

  const mostrar = (e) => {
    const rosto = $('rosto');
    const imagem = IMAGENS[e.estado];
    rosto.hidden = !imagem;
    if (imagem && !rosto.src.endsWith(imagem)) rosto.src = `/rostojose/${imagem}`;
    const corte = CORTE_TEXTO[e.estado];
    rosto.style.clipPath = corte ? `inset(0 ${1920 - corte}px 0 0)` : 'none';

    if (e.estado !== estadoAnterior) {
      // Só o estado "transicao" desliza; nos outros o rosto volta para x 0 sem animação
      rosto.classList.remove('deslizando');
      if (e.estado === 'transicao') {
        void rosto.offsetWidth; // reinicia a animação
        rosto.classList.add('deslizando');
      }
      estadoAnterior = e.estado;
    }

    $('comando').hidden = e.estado !== 'comando' && e.estado !== 'executando';
    $('comando').textContent = e.comando;
    $('agradecimento').hidden = e.estado !== 'agradecimento';
    $('fase').hidden = !FASES[e.estado];
    $('fase').textContent = FASES[e.estado] || '';
    $('dica').hidden = !COM_DICA.includes(e.estado);

    $('historia').hidden = e.estado !== 'historia';
    if (e.estado === 'historia') {
      $('titulo').textContent = e.titulo;
      $('bolinha').style.left = `${164.6 + (1617 - 164.6) * e.progresso}px`;
    }

    $('transcricao').textContent = e.transcricao;
    $('velocidade').textContent = e.velocidade;
    $('aviso-chamar').textContent = e.dica || '';
    $('aviso-chamar').hidden = !e.dica;

    const chave = `${e.estado}|${e.comando}|${e.titulo}`; // o conteúdo mudou: enquadra de novo
    if (chave !== chaveAnterior) {
      chaveAnterior = chave;
      estadoAtual = e.estado;
      enquadrar(e.estado);
    }
  };

  const atualizar = async () => {
    try {
      const resposta = await fetch('/estado', { cache: 'no-store' });
      mostrar(await resposta.json());
      $('aviso').style.display = 'none';
    } catch {
      $('aviso').style.display = 'flex';
    }
    setTimeout(atualizar, 100);
  };
  atualizar();
</script>
</body>
</html>
